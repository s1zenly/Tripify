type: object
properties:
  email:
    type: string
    format: email
    example: "lev@example.com"
  firstName:
    type: string
    example: "Лев"
  lastName:
    type: string
    example: "Гурьков"
  city:
    type: string
    example: "Москва"
  country:
    type: string
    example: "Россия"
  currency:
    type: string
    example: "Российский рубль"
  citizenship:
    type: string
    example: "РФ"