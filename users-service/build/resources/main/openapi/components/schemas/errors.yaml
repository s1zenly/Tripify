ErrorCode:
  type: string
  enum:
    - PROFILE_NOT_FOUND
    - INTERNAL_SERVER_ERROR
    - UPDATE_USER_PROFILE_ERROR

ErrorResponse:
  type: object
  required:
    - code
    - message
    - timestamp
  properties:
    code:
      $ref: '#/ErrorCode'
    message:
      type: string
      example: Invalid OTP code
    details:
      type: array
      items:
        $ref: '#/ErrorDetail'
    timestamp:
      type: string
      format: date-time

ErrorDetail:
  type: object
  properties:
    field:
      type: string
      example: phoneNumber
    message:
      type: string
      example: must be a valid phone number