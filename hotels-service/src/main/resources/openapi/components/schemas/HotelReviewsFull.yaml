type: object
properties:
  total:
    type: integer
    example: 928

  rating:
    type: number
    format: double
    example: 3.7

  reviewsClasses:
    $ref: './ReviewsClasses.yaml'

  reviewsHistogram:
    type: object
    additionalProperties:
      type: integer
    example:
      "10": 120
      "9": 80
      "8": 45
      "7": 20

  comments:
    type: array
    items:
      $ref: './ReviewComment.yaml'

  totalComments:
    type: integer
    example: 300