type: object
properties:
  author:
    type: string
    example: Name6

  country:
    type: string
    example: RU

  vacationType:
    type: string
    example: family

  rating:
    type: number
    format: double
    example: 9.0

  goodPart:
    type: string
    nullable: true

  badPart:
    type: string
    nullable: true

  commonText:
    type: string
    nullable: true

  reviewDate:
    type: string
    format: date
    example: "2026-05-15"

  photos:
    type: array
    items:
      $ref: './Photo.yaml'