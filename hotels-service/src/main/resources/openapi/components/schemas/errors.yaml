ErrorCode:
  type: string
  enum:
    - TEST

ErrorResponse:
  type: object
  required:
    - code
    - message
    - timestamp
  properties:
    code:
      $ref: '#/ErrorCode'
    message:
      type: string
      example: Invalid date
    details:
      type: array
      items:
        $ref: '#/ErrorDetail'
    timestamp:
      type: string
      format: date-time

ErrorDetail:
  type: object
  properties:
    field:
      type: string
      example: destination
    message:
      type: string
      example: must be APLHA-2