get:
  tags:
    - hotels
  summary: Get hotel details
  operationId: getHotelById
  description: >
    Единые query-параметры search context, что и в GET /hotels.
    Фронт повторяет их при открытии карточки для PackService и аналитики.

  parameters:
    - $ref: '../components/parameters.yaml#/XAnonymousId'
    - $ref: '../components/parameters.yaml#/XGenerationId'
    - $ref: '../components/parameters.yaml#/XPackRevision'
    - $ref: '../components/parameters.yaml#/XGenerationMode'
    - $ref: '../components/parameters.yaml#/XRequestId'
    - $ref: '../components/parameters.yaml#/XHotelsRevision'

    - name: hotelId
      in: path
      required: true
      description: Internal Tripify hotel id (deterministic UUID)
      schema:
        type: string
        format: uuid
      example: 8f4e3c2d-1b0a-5f6e-7c8d-9e0f1a2b3c4d

    - $ref: '../components/parameters.yaml#/SearchOriginCountry'
    - $ref: '../components/parameters.yaml#/SearchOriginCity'
    - $ref: '../components/parameters.yaml#/SearchDestinationCountry'
    - $ref: '../components/parameters.yaml#/SearchDestinationCity'
    - $ref: '../components/parameters.yaml#/SearchDateFrom'
    - $ref: '../components/parameters.yaml#/SearchDateTo'
    - $ref: '../components/parameters.yaml#/SearchCurrency'
    - $ref: '../components/parameters.yaml#/SearchAdults'
    - $ref: '../components/parameters.yaml#/SearchChildren'
    - $ref: '../components/parameters.yaml#/SearchBudget'
    - $ref: '../components/parameters.yaml#/SearchFilters'

  responses:
    '200':
      description: Hotel details fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/HotelDetails.yaml'

    '400':
      $ref: '../components/responses.yaml#/BadRequest'

    '404':
      $ref: '../components/responses.yaml#/NotFound'

    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
