get:
  tags:
    - hotels
  summary: Get hotel details
  operationId: getHotelById

  parameters:
    - $ref: '../components/parameters.yaml#/XAnonymousId'
    - $ref: '../components/parameters.yaml#/XGenerationId'
    - $ref: '../components/parameters.yaml#/XPackRevision'
    - $ref: '../components/parameters.yaml#/XGenerationMode'
    - $ref: '../components/parameters.yaml#/XRequestId'
    - $ref: '../components/parameters.yaml#/XHotelsRevision'

    - name: hotelId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 7467355

  responses:
    '200':
      description: Hotel details fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/HotelDetails.yaml'

    '400':
      $ref: '../components/responses.yaml#/BadRequest'

    '404':
      $ref: '../components/responses.yaml#/NotFound'

    '500':
      $ref: '../components/responses.yaml#/InternalServerError'