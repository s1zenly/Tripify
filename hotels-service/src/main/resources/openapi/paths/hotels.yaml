get:
  tags:
    - hotels
  summary: Get hotel cards list
  operationId: getHotels

  parameters:
    - $ref: '../components/parameters.yaml#/XAnonymousId'
    - $ref: '../components/parameters.yaml#/XGenerationId'
    - $ref: '../components/parameters.yaml#/XPackRevision'
    - $ref: '../components/parameters.yaml#/XGenerationMode'
    - $ref: '../components/parameters.yaml#/XRequestId'
    - $ref: '../components/parameters.yaml#/XHotelsRevision'

    - name: city
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      example: Dubai

    - name: check_in
      in: query
      required: true
      schema:
        type: string
        format: date
      example: "2026-06-01"

    - name: check_out
      in: query
      required: true
      schema:
        type: string
        format: date
      example: "2026-06-10"

    - name: guests
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 2

    - name: budget
      in: query
      required: false
      description: Maximum total travel budget for hotels
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 150000

    - name: currency
      in: query
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 3
      example: RUB

    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0

  responses:
    '200':
      description: Hotels fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/HotelsResponse.yaml'

    '400':
      $ref: '../components/responses.yaml#/BadRequest'

    '500':
      $ref: '../components/responses.yaml#/InternalServerError'