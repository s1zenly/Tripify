get:
  tags:
    - hotels
  summary: Get hotel cards list
  operationId: getHotels

  parameters:
    - $ref: '../components/parameters.yaml#/XAnonymousId'
    - $ref: '../components/parameters.yaml#/XGenerationId'
    - $ref: '../components/parameters.yaml#/XPackRevision'
    - $ref: '../components/parameters.yaml#/XGenerationMode'
    - $ref: '../components/parameters.yaml#/XRequestId'
    - $ref: '../components/parameters.yaml#/XHotelsRevision'

    - $ref: '../components/parameters.yaml#/HotelsSearchCountry'
    - $ref: '../components/parameters.yaml#/HotelsSearchCity'
    - $ref: '../components/parameters.yaml#/HotelsSearchCheckIn'
    - $ref: '../components/parameters.yaml#/HotelsSearchCheckOut'
    - $ref: '../components/parameters.yaml#/HotelsSearchCurrency'
    - $ref: '../components/parameters.yaml#/HotelsSearchGuests'
    - $ref: '../components/parameters.yaml#/HotelsSearchBudget'
    - $ref: '../components/parameters.yaml#/HotelsSearchFilters'

    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    - name: cursor
      in: query
      required: false
      description: hotelId последнего отеля на предыдущей странице (nextCursor из ответа)
      schema:
        type: string
        format: uuid

  responses:
    '200':
      description: Hotels fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/HotelsResponse.yaml'

    '400':
      $ref: '../components/responses.yaml#/BadRequest'

    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
