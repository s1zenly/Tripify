get:
  tags:
    - hotels
  summary: Get available hotel filters for city
  operationId: getHotelFilters

  parameters:
    - $ref: '../components/parameters.yaml#/XRequestId'

    - name: country
      in: query
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 2
      example: AE

    - name: city
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      example: Dubai

  responses:
    '200':
      description: Available filters fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/HotelFiltersResponse.yaml'

    '400':
      $ref: '../components/responses.yaml#/BadRequest'

    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
