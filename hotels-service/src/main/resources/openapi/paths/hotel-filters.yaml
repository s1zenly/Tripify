get:
  tags:
    - hotels
  summary: Get hotel search filters catalog
  operationId: getHotelFilters
  description: >
    Возвращает общий каталог фильтров для UI. Список не зависит от маршрута и дат —
    применяется на этапе GET /hotels через query-параметр filters.

  responses:
    '200':
      description: Filters catalog fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/HotelFiltersResponse.yaml'

    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
