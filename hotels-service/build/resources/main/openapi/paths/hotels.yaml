get:
  tags:
    - hotels
  summary: Get hotel cards list
  operationId: getHotels

  parameters:
    - $ref: '../components/parameters.yaml#/XAnonymousId'
    - $ref: '../components/parameters.yaml#/XGenerationId'
    - $ref: '../components/parameters.yaml#/XPackRevision'
    - $ref: '../components/parameters.yaml#/XGenerationMode'
    - $ref: '../components/parameters.yaml#/XRequestId'
    - $ref: '../components/parameters.yaml#/XHotelsRevision'

    - name: country
      in: query
      required: true
      description: Country code ISO Alpha-2
      schema:
        type: string
        minLength: 2
        maxLength: 2
      example: AE

    - name: city
      in: query
      required: true
      description: City where hotels are searched
      schema:
        type: string
        minLength: 1
      example: Dubai

    - name: check_in
      in: query
      required: true
      schema:
        type: string
        format: date
      example: "2026-06-01"

    - name: check_out
      in: query
      required: true
      schema:
        type: string
        format: date
      example: "2026-06-10"

    - name: currency
      in: query
      required: true
      description: Валюта ответа для фронта (цены в БД в USD, конвертируются при отдаче)
      schema:
        type: string
        minLength: 3
        maxLength: 3
      example: RUB

    - name: guests
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      example: 2

    - name: budget
      in: query
      required: false
      description: Максимальная цена в валюте currency (в БД сравнивается после конвертации в USD)
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 150000

    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    - name: cursor
      in: query
      required: false
      description: hotelId последнего отеля с предыдущей страницы (id > cursor)
      schema:
        type: string
        format: uuid

    - name: filters
      in: query
      required: false
      description: >
        Фильтры из каталога GET /hotels/filters (AND). Примеры: pool, beachfront, rating_8_plus, stars_4_plus.
        budget по-прежнему отдельный параметр (диапазон цены).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
        - pool
        - beachfront
        - rating_8_plus

  responses:
    '200':
      description: Hotels fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/HotelsResponse.yaml'

    '400':
      $ref: '../components/responses.yaml#/BadRequest'

    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
