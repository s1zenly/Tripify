get:
  tags: [packs]
  summary: Get popular packs
  description: |
    Returns a fixed set of 6 random completed pack cards from the catalog.
    No search parameters and no user context — selection is random on each call.
    Response shape is identical to GET /v1/packs.
  operationId: getPopularPacks
  parameters:
    - $ref: '../components/parameters.yaml#/XRequestId'
  security:
    - bearerAuth: []
    - {}
  responses:
    '200':
      description: Popular packs fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/PacksResponse.yaml'
    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
