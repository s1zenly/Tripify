get:
  tags: [packs]
  summary: Get current user pack view history
  description: |
    Returns completed pack cards for the current user ordered by creation time (oldest first).
    No search parameters — identity is resolved from JWT or X-Anonymous-Id.
    If Authorization Bearer JWT is present, packs are loaded by user_id.
    Otherwise packs are loaded by X-Anonymous-Id.
  operationId: getPacksUserView
  parameters:
    - $ref: '../components/parameters.yaml#/XAnonymousId'
    - $ref: '../components/parameters.yaml#/XRequestId'
  security:
    - bearerAuth: []
    - {}
  responses:
    '200':
      description: User view history fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/PacksResponse.yaml'
    '400':
      $ref: '../components/responses.yaml#/BadRequest'
    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
