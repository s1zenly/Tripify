get:
  tags: [packs]
  summary: Get pack details by id
  description: |
    Returns full pack snapshot with hotel and ticket detail models by pack id from PostgreSQL.
    X-Anonymous-Id and X-Request-Id are required for request tracing only.
  operationId: getPackById
  parameters:
    - $ref: '../components/parameters.yaml#/XAnonymousId'
    - $ref: '../components/parameters.yaml#/XRequestId'
    - $ref: '../components/parameters.yaml#/PackId'
  security:
    - bearerAuth: []
    - {}
  responses:
    '200':
      description: Pack details fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Pack.yaml'
    '404':
      $ref: '../components/responses.yaml#/NotFound'
    '400':
      $ref: '../components/responses.yaml#/BadRequest'
    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
