type: object
required:
  - name
  - stars
properties:
  name:
    type: string
    example: Switzerland Palace Hotel
  stars:
    type: integer
    minimum: 1
    maximum: 5
    example: 5
  meal_type:
    type: string
    example: ALL_INCLUSIVE
  image_url:
    type: string
    format: uri
    example: https://s3.example.com/hotel.jpg
