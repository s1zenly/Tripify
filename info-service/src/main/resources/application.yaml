server:
  port: 8080

spring:
  application:
    name: info-service

  config:
    import: classpath:info-countries.yaml

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/tripify_info}

tripify:
  jwt:
    secret: ${TRIPIFY_JWT_SECRET:da422807dea6119e0752c14b58235a2e3f76dd88bbeac6be3ce9303481df04bc}

  info:
    scraping:
      enabled: true
      cron: "0 0 3 ? * MON"
      connect-timeout-ms: 10000
      read-timeout-ms: 15000
      user-agent: "TripifyInfoServiceBot/1.0"
    weather:
      enabled: true
      provider: open-meteo
      api-url: https://api.open-meteo.com/v1/forecast
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      max-days: 16

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_0
  swagger-ui:
    path: /v3/swagger-ui.html
    disable-swagger-default-url: true
    try-it-out-enabled: true
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
