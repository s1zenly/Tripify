type: object
required:
  - country_id
  - country_name
  - local_currency
  - rates
  - tabs
  - photos
properties:
  country_id:
    $ref: './IsoCountryAlpha2.yaml'
  country_name:
    type: string
    example: ОАЭ
  local_currency:
    $ref: './IsoCurrencyCode.yaml'
    description: |
      ISO 4217 code of the country's local currency (e.g. CNY for China).
      Used as base for the `rates` list below.
    example: AED
  rates:
    type: array
    description: |
      Exchange rates into `local_currency`. Multiply amount in currency X by `rate`
      to get amount in local currency.
    items:
      $ref: './CurrencyRateItem.yaml'
  tabs:
    type: array
    items:
      $ref: './CountryInfoTab.yaml'
  photos:
    type: array
    description: |
      Representative photo URLs for the country (object storage links).
      Up to 3 images, intended for display alongside the country guide.
    items:
      type: string
    example:
      - https://storage.yandexcloud.net/test-hotels-images/AE/DXB/225865058.jpg
      - https://storage.yandexcloud.net/test-hotels-images/AE/DXB/234548985.jpg
      - https://storage.yandexcloud.net/test-hotels-images/AE/DXB/428594127.jpg
