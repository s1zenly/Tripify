UserResponse:
  type: object
  required:
    - id
    - phoneNumber
    - roles
    - status
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    phoneNumber:
      type: string
      example: "+79991234567"
    firstName:
      type: string
      example: Ivan
    lastName:
      type: string
      example: Ivanov
    roles:
      type: array
      items:
        $ref: '#/Role'
    status:
      $ref: '#/UserStatus'
    createdAt:
      type: string
      format: date-time

UpdateUserRequest:
  type: object
  properties:
    firstName:
      type: string
      minLength: 1
      maxLength: 100
    lastName:
      type: string
      minLength: 1
      maxLength: 100

Role:
  type: string
  enum:
    - USER
    - ADMIN
    - SERVICE

UserStatus:
  type: string
  enum:
    - ACTIVE
    - BLOCKED
    - DELETED