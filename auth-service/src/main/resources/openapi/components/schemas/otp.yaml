OtpRequest:
  type: object
  required:
    - phoneNumber
  properties:
    phoneNumber:
      type: string
      description: Phone number in E.164 format
      example: "+79991234567"

OtpVerifyRequest:
  type: object
  required:
    - phoneNumber
    - code
  properties:
    phoneNumber:
      type: string
      description: Phone number in E.164 format
      example: "+79991234567"
    code:
      type: string
      minLength: 4
      maxLength: 8
      example: "123456"
    deviceName:
      type: string
      maxLength: 255
      example: "Chrome on macOS"