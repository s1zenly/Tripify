OtpRequest:
  type: object
  required:
    - phone_number
  properties:
    phone_number:
      type: string
      description: Phone number in E.164 format
      example: "+4915123456789"
      pattern: '^\+[1-9]\d{1,14}$'

OtpVerifyRequest:
  type: object
  required:
    - phone_number
    - code
  properties:
    phone_number:
      type: string
      description: Phone number in E.164 format
      example: "+4915123456789"
      pattern: '^\+[1-9]\d{1,14}$'
    code:
      type: string
      description: 4-digit one-time verification code
      example: "1234"
      pattern: '^\d{4}$'
