RefreshTokenRequest:
  type: object
  required:
    - refreshToken
  properties:
    refreshToken:
      type: string

LogoutRequest:
  type: object
  required:
    - refreshToken
  properties:
    refreshToken:
      type: string

TokenResponse:
  type: object
  required:
    - tokenType
    - accessToken
    - refreshToken
    - accessExpiresAt
  properties:
    tokenType:
      type: string
      example: Bearer
    accessToken:
      type: string
    refreshToken:
      type: string
    accessExpiresAt:
      type: string
      format: date-time
      example: 2026-05-10T18:45:00Z