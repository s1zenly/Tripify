ErrorCode:
  type: string
  enum:
    - INVALID_PHONE_NUMBER
    - TOO_MANY_REQUESTS
    - USER_BLOCKED
    - USER_INACTIVE
    - INTERNAL_SERVER_ERROR
    - VALIDATION_ERROR
    - OTP_NOT_FOUND
    - OTP_EXPIRED
    - OTP_FAILED
    - OTP_INVALID
    - INVALID_REFRESH
    - BAD_REFRESH
    - REFRESH_REVOKED

ErrorResponse:
  type: object
  required:
    - code
    - message
    - timestamp
  properties:
    code:
      $ref: '#/ErrorCode'
    message:
      type: string
      example: Invalid OTP code
    details:
      type: array
      items:
        $ref: '#/ErrorDetail'
    timestamp:
      type: string
      format: date-time

ErrorDetail:
  type: object
  properties:
    field:
      type: string
      example: phoneNumber
    message:
      type: string
      example: must be a valid phone number