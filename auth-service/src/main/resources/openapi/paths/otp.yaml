requestOtp:
  post:
    tags: [OTP]
    operationId: requestOtp
    summary: Request OTP code by phone number
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/otp.yaml#/OtpRequest'
    responses:
      '204':
        description: OTP sent
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

verifyOtp:
  post:
    tags: [OTP]
    operationId: verifyOtp
    summary: Verify OTP and issue tokens via HttpOnly cookies
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/otp.yaml#/OtpVerifyRequest'
    responses:
      '204':
        description: Authenticated, tokens set in HttpOnly cookies
        headers:
          Set-Cookie:
            description: access_token and refresh_token HttpOnly cookies
            schema:
              type: string
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
