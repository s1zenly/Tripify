refreshToken:
  post:
    tags: [Tokens]
    operationId: refreshToken
    summary: Refresh access token using refresh_token HttpOnly cookie
    responses:
      '204':
        description: Tokens refreshed, new cookies set
        headers:
          Set-Cookie:
            description: Updated access_token and refresh_token HttpOnly cookies
            schema:
              type: string
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

logout:
  post:
    tags: [Tokens]
    operationId: logout
    summary: Logout current session and clear auth cookies
    security:
      - cookieAuth: []
    responses:
      '204':
        description: Logged out, auth cookies cleared
        headers:
          Set-Cookie:
            description: Cleared access_token and refresh_token cookies
            schema:
              type: string
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
