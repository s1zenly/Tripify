tripify:
  jwt:
    secret: ${TRIPIFY_JWT_SECRET:da422807dea6119e0752c14b58235a2e3f76dd88bbeac6be3ce9303481df04bc}
  search:
    provider-timeout: 15s
  kafka:
    topics:
      tickets-search-completed: tickets.search.completed
      tickets-pack-viewed: tickets.pack.viewed
  redis:
    offers:
      key-prefix: "ticket:offer:"
      default-ttl: 30m

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password:
  timeout-ms: 2000
  max-total: 20
  max-idle: 10
  min-idle: 2

spring:
  application:
    name: tickets-service

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  jackson:
    property-naming-strategy: SNAKE_CASE

providers:
  EMULATION:
    enabled: true
    disable-duration-on-429: 60s

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_0
  swagger-ui:
    path: /v3/swagger-ui.html
    disable-swagger-default-url: true
    try-it-out-enabled: true
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
