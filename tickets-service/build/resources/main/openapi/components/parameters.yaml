XAnonymousId:
  name: X-Anonymous-Id
  in: header
  required: true
  description: Anonymous user identifier
  schema:
    type: string
  example: anona8f91d_f445g4d3_rev1

XGenerationId:
  name: X-Generation-Id
  in: header
  required: true
  description: Travel generation identifier
  schema:
    type: string
  example: anon_a8f91d_ab91ff23_rev1

XPackRevision:
  name: X-Pack-Revision
  in: header
  required: true
  description: Current pack revision number
  schema:
    type: integer
    minimum: 1
  example: 1

XGenerationMode:
  name: X-Generation-Mode
  in: header
  required: true
  description: Generation mode
  schema:
    $ref: './schemas/enums/GenerationMode.yaml'
  example: FULL

XRequestId:
  name: X-Request-Id
  in: header
  required: true
  description: Request tracing identifier
  schema:
    type: string
  example: req-123

XTicketsRevision:
  name: X-Tickets-Revision
  in: header
  required: false
  description: Tickets revision number
  schema:
    type: integer
    minimum: 1
  example: 1

SearchOriginCountry:
  name: origin_country
  in: query
  required: true
  description: Origin country ISO Alpha-2
  schema:
    type: string
    minLength: 2
    maxLength: 2
  example: RU

SearchOriginCity:
  name: origin_city
  in: query
  required: true
  description: Origin city IATA code
  schema:
    type: string
    minLength: 3
    maxLength: 3
  example: MOW

SearchDestinationCountry:
  name: destination_country
  in: query
  required: true
  description: Destination country ISO Alpha-2
  schema:
    type: string
    minLength: 2
    maxLength: 2
  example: AE

SearchDestinationCity:
  name: destination_city
  in: query
  required: true
  description: Destination city IATA code
  schema:
    type: string
    minLength: 3
    maxLength: 3
  example: DXB

SearchDateFrom:
  name: date_from
  in: query
  required: true
  description: Trip start date (outbound departure)
  schema:
    type: string
    format: date
  example: '2026-06-01'

SearchDateTo:
  name: date_to
  in: query
  required: true
  description: Trip end date (return departure)
  schema:
    type: string
    format: date
  example: '2026-06-10'

SearchCurrency:
  name: currency
  in: query
  required: true
  description: Response currency for the frontend
  schema:
    $ref: './schemas/enums/Currency.yaml'
  example: RUB

SearchAdults:
  name: adults
  in: query
  required: true
  description: Number of adult travelers
  schema:
    type: integer
    minimum: 1
    maximum: 9
  example: 2

SearchChildren:
  name: children
  in: query
  required: false
  description: Number of child travelers
  schema:
    type: integer
    minimum: 0
    maximum: 9
    default: 0
  example: 0

SearchBudget:
  name: budget
  in: query
  required: false
  description: Optional trip budget in currency
  schema:
    type: integer
    format: int64
    minimum: 1
  example: 50000

SearchFilters:
  name: filters
  in: query
  required: false
  description: Filters from GET /tickets/filters catalog
  schema:
    type: array
    items:
      type: string
  style: form
  explode: true
  example:
    - direct
    - refundable
