get:
  tags:
    - tickets
  summary: Search flight tickets
  operationId: searchTickets

  parameters:
    - $ref: '../components/parameters.yaml#/OriginCityCode'
    - $ref: '../components/parameters.yaml#/DestinationCityCode'
    - $ref: '../components/parameters.yaml#/DepartureDate'
    - $ref: '../components/parameters.yaml#/ReturnDate'
    - $ref: '../components/parameters.yaml#/Currency'
    - $ref: '../components/parameters.yaml#/Adults'
    - $ref: '../components/parameters.yaml#/BudgetMaxAmount'
    - $ref: '../components/parameters.yaml#/Children'
    - $ref: '../components/parameters.yaml#/Infants'
    - $ref: '../components/parameters.yaml#/TicketSearchFilters'

  responses:
    '200':
      description: Tickets fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/TicketsResponse.yaml'

    '400':
      $ref: '../components/responses.yaml#/BadRequest'

    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
