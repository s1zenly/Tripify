get:
  tags:
    - tickets
  summary: Get ticket search filters catalog
  operationId: getTicketFilters
  description: >
    Возвращает общий каталог фильтров для UI. Список не зависит от маршрута и дат —
    применяется на этапе GET /tickets через query-параметр filters.

  responses:
    '200':
      description: Filters catalog fetched successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/TicketFiltersResponse.yaml'

    '500':
      $ref: '../components/responses.yaml#/InternalServerError'
