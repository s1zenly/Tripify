openapi: 3.0.3

info:
  title: Tripify Tickets Service API
  description: API contracts for tickets search
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local environment
  - url: https://tripify.com
    description: Production environment

tags:
  - name: tickets
    description: Flight tickets search API

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/security-schemes.yaml#/bearerAuth'

paths:
  /tickets:
    $ref: './paths/tickets.yaml'

  /tickets/filters:
    $ref: './paths/ticket-filters.yaml'

  /tickets/{id}:
    $ref: './paths/ticket-by-id.yaml'
