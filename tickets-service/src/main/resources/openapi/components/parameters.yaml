XAnonymousId:
  name: X-Anonymous-Id
  in: header
  required: true
  description: Anonymous user identifier
  schema:
    type: string
  example: anona8f91d_f445g4d3_rev1

XGenerationId:
  name: X-Generation-Id
  in: header
  required: true
  description: Travel generation identifier
  schema:
    type: string
  example: anon_a8f91d_ab91ff23_rev1

XPackRevision:
  name: X-Pack-Revision
  in: header
  required: true
  description: Current pack revision number
  schema:
    type: integer
    minimum: 1
  example: 1

XGenerationMode:
  name: X-Generation-Mode
  in: header
  required: true
  description: Generation mode
  schema:
    type: string
    enum:
      - FULL
      - HOTELS
      - TICKETS
  example: FULL

XRequestId:
  name: X-Request-Id
  in: header
  required: true
  description: Request tracing identifier
  schema:
    type: string
  example: req-123

XTicketsRevision:
  name: X-Tickets-Revision
  in: header
  required: false
  description: Tickets revision number
  schema:
    type: integer
    minimum: 1
  example: 1

OriginCityCode:
  name: origin_city_code
  in: query
  required: true
  description: Origin city IATA code
  schema:
    type: string
    minLength: 3
    maxLength: 3
  example: MOW

DestinationCityCode:
  name: destination_city_code
  in: query
  required: true
  description: Destination city IATA code
  schema:
    type: string
    minLength: 3
    maxLength: 3
  example: DXB

DepartureDate:
  name: departure_date
  in: query
  required: true
  description: Outbound flight departure date
  schema:
    type: string
    format: date
  example: '2026-05-12'

ReturnDate:
  name: return_date
  in: query
  required: true
  description: Return flight departure date
  schema:
    type: string
    format: date
  example: '2026-05-20'

BudgetMaxAmount:
  name: budget_max_amount
  in: query
  required: false
  description: Maximum ticket price per offer (in currency)
  schema:
    type: integer
    format: int64
    minimum: 1
  example: 50000

Currency:
  name: currency
  in: query
  required: true
  description: Валюта ответа для фронта (цены хранятся в RUB, конвертируются при отдаче). Если передан budget_max_amount — бюджет в этой валюте.
  schema:
    $ref: './schemas/enums/Currency.yaml'
  example: RUB

Adults:
  name: adults
  in: query
  required: true
  description: Number of adult passengers
  schema:
    type: integer
    minimum: 1
    maximum: 9
  example: 2

Children:
  name: children
  in: query
  required: false
  description: Number of child passengers
  schema:
    type: integer
    minimum: 0
    maximum: 9
    default: 0
  example: 0

Infants:
  name: infants
  in: query
  required: false
  description: Number of infant passengers
  schema:
    type: integer
    minimum: 0
    maximum: 9
    default: 0
  example: 0

TicketSearchFilters:
  name: filters
  in: query
  required: false
  description: Фильтры из каталога GET /tickets/filters
  schema:
    type: array
    items:
      type: string
  style: form
  explode: true
  example:
    - direct
    - refundable
