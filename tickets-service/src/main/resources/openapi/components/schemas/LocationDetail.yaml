type: object
required:
  - city
  - airport_code
  - airport_name
properties:
  city:
    type: string
    minLength: 3
    maxLength: 3
    description: City IATA code
    example: MOW
  airport_code:
    type: string
    minLength: 3
    maxLength: 3
    description: Airport IATA code
    example: SVO
  airport_name:
    type: string
    example: Sheremetyevo
  terminal:
    type: string
    example: C
