services:
  postgres:
    image: postgres:16
    container_name: tripify-postgres
    environment:
      POSTGRES_DB: tripify_db
      POSTGRES_USER: tripify
      POSTGRES_PASSWORD: tripify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tripify -d tripify_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tripify

  kafka:
    image: apache/kafka:latest
    container_name: tripify-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://${SERVER_IP:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tripify

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tripify-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tripify-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - tripify

  redis:
    image: redis:8-alpine
    container_name: tripify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tripify

  mongo:
    image: mongo:7
    container_name: tripify-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - tripify

  mongo-express:
    image: mongo-express:1
    container_name: tripify-mongo-express
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8085:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - tripify

  auth-service:
    build:
      context: ../../auth-service
      dockerfile: ../docker/local/Dockerfile
    container_name: tripify-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripify_db
      SPRING_DATASOURCE_USERNAME: tripify
      SPRING_DATASOURCE_PASSWORD: tripify
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-master.yaml
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - tripify

  hotels-parser:
    build:
      context: ../../hotels-parser
      dockerfile: ../docker/local/Dockerfile
    container_name: tripify-hotels-parser
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_KAFKA_TOPICS_HOTELS_PARSED: hotels.parsed
    ports:
      - "8081:8080"
    networks:
      - tripify

  notification-service:
    build:
      context: ../../notification-service
      dockerfile: ../docker/local/Dockerfile
    container_name: tripify-notification-service
    ports:
      - "8082:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - tripify

  users-service:
    build:
      context: ../../users-service
      dockerfile: ../docker/local/Dockerfile
    container_name: tripify-users-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripify_db
      SPRING_DATASOURCE_USERNAME: tripify
      SPRING_DATASOURCE_PASSWORD: tripify
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-master.yaml
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8080"
    networks:
      - tripify

  hotels-service:
    build:
      context: ../../hotels-service
      dockerfile: ../docker/local/Dockerfile
    container_name: tripify-hotels-service
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripify_db
      SPRING_DATASOURCE_USERNAME: tripify
      SPRING_DATASOURCE_PASSWORD: tripify
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-master.yaml
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_MONGODB_URI: mongodb://mongo:27017/tripify_hotels

      TRIPIFY_S3_ENDPOINT: https://storage.yandexcloud.net
      TRIPIFY_S3_REGION: ru-central1
      TRIPIFY_S3_BUCKET: tripify-hotels
      TRIPIFY_S3_ROOMS_BUCKET: tripify-hotels-rooms
      TRIPIFY_S3_REVIEWS_BUCKET: tripify-hotels-reviews
      TRIPIFY_S3_UPLOAD_ENABLED: "false"
      TRIPIFY_S3_ACCESS_KEY: YCAJEhwv_RECwDriBuxqXQSyl
      TRIPIFY_S3_SECRET_KEY: YCNw-gkJLJoNEg2hLo_-kX_PjHHAxWiSuwqc81lr
    ports:
      - "8084:8080"
    networks:
      - tripify

  tickets-service:
    build:
      context: ../../tickets-service
      dockerfile: ../docker/local/Dockerfile
    container_name: tripify-tickets-service
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRIPIFY_JWT_SECRET: da422807dea6119e0752c14b58235a2e3f76dd88bbeac6be3ce9303481df04bc
    ports:
      - "8086:8080"
    networks:
      - tripify

  info-service:
    build:
      context: ../../info-service
      dockerfile: ../docker/local/Dockerfile
    container_name: tripify-info-service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/tripify_info
      TRIPIFY_JWT_SECRET: da422807dea6119e0752c14b58235a2e3f76dd88bbeac6be3ce9303481df04bc
      TRIPIFY_INFO_SCRAPING_ENABLED: "true"
    ports:
      - "8087:8080"
    networks:
      - tripify

  pack-service:
    build:
      context: ../../pack-service
      dockerfile: ../docker/local/Dockerfile
    container_name: tripify-pack-service
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripify_db
      SPRING_DATASOURCE_USERNAME: tripify
      SPRING_DATASOURCE_PASSWORD: tripify
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:/db/changelog/db.changelog-master.yaml
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MONGODB_URI: mongodb://mongo:27017/tripify_pack
      TRIPIFY_JWT_SECRET: da422807dea6119e0752c14b58235a2e3f76dd88bbeac6be3ce9303481df04bc
    ports:
      - "8088:8080"
    networks:
      - tripify

  kong:
    image: kong:3.9
    container_name: tripify-kong
    depends_on:
      - auth-service
      - hotels-service
      - tickets-service
      - users-service
      - info-service
      - pack-service
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      TRIPIFY_JWT_SECRET: da422807dea6119e0752c14b58235a2e3f76dd88bbeac6be3ce9303481df04bc
      TRIPIFY_JWT_ISSUER: tripify-auth
      TRIPIFY_ACCESS_COOKIE_NAME: access_token
    volumes:
      - ../kong/kong.template.yaml:/kong/kong.template.yaml:ro
      - ../kong/prepare-auth.lua.tmpl:/kong/prepare-auth.lua.tmpl:ro
      - ../kong/inject-user-id.lua.tmpl:/kong/inject-user-id.lua.tmpl:ro
      - ../kong/docker-entrypoint.sh:/kong/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/kong/docker-entrypoint.sh"]
    ports:
      - "8000:8000"
      - "8001:8001"
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - tripify

volumes:
  postgres_data:
  mongo_data:

networks:
  tripify:
    name: tripify
    driver: bridge
