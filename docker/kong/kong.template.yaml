_format_version: "3.0"
_transform: true

consumers:
  - username: anonymous
    custom_id: anonymous

  - username: tripify-auth
    custom_id: tripify-auth
    jwt_secrets:
      - key: tripify-auth
        secret: __TRIPIFY_JWT_SECRET__
        algorithm: HS256

services:
  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false

  - name: hotels-service
    url: http://hotels-service:8080
    routes:
      - name: hotels-route
        paths:
          - /hotels
        strip_path: false

  - name: tickets-service
    url: http://tickets-service:8080
    routes:
      - name: tickets-route
        paths:
          - /tickets
        strip_path: false

  - name: users-service
    url: http://users-service:8080
    routes:
      - name: users-route
        paths:
          - /users
        strip_path: false

  - name: info-service
    url: http://info-service:8080
    routes:
      - name: info-countries-route
        paths:
          - /v1/countries
        strip_path: false
      - name: info-admin-route
        paths:
          - /v1/admin
        strip_path: false

  - name: pack-service
    url: http://pack-service:8080
    routes:
      - name: pack-route
        paths:
          - /v1/packs
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - https://tripify.tech
        - http://tripifysite-pavelt1.amvera.io
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
        - Origin
        - X-Anonymous-Id
        - X-Request-Id
        - X-Generation-Id
        - X-Generation-Mode
        - X-Pack-Revision
        - X-Hotels-Revision
        - X-Tickets-Revision
        - Cookie
      exposed_headers:
        - Set-Cookie
      credentials: true
      max_age: 3600

  - name: pre-function
    config:
      access:
        - |
__PREPARE_AUTH_LUA__

  - name: post-function
    config:
      access:
        - |
__INJECT_USER_ID_LUA__

  - name: jwt
    service: hotels-service
    config:
      cookie_names:
        - access_token
      header_names:
        - authorization
      key_claim_name: iss
      claims_to_verify:
        - exp
      anonymous: anonymous
      run_on_preflight: false

  - name: jwt
    service: tickets-service
    config:
      cookie_names:
        - access_token
      header_names:
        - authorization
      key_claim_name: iss
      claims_to_verify:
        - exp
      anonymous: anonymous
      run_on_preflight: false

  - name: jwt
    service: users-service
    config:
      cookie_names:
        - access_token
      header_names:
        - authorization
      key_claim_name: iss
      claims_to_verify:
        - exp
      anonymous: anonymous
      run_on_preflight: false

  - name: jwt
    service: info-service
    config:
      cookie_names:
        - access_token
      header_names:
        - authorization
      key_claim_name: iss
      claims_to_verify:
        - exp
      anonymous: anonymous
      run_on_preflight: false

  - name: jwt
    service: pack-service
    config:
      cookie_names:
        - access_token
      header_names:
        - authorization
      key_claim_name: iss
      claims_to_verify:
        - exp
      anonymous: anonymous
      run_on_preflight: false
